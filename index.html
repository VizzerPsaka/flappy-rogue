<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4ec0ca">
<title>Flappy Rogue</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #111; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: absolute; left: 0; top: 0; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== Setup =====
const W = 360, H = 640, GROUND = 60;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2;
  offY = (vh - H * scale) / 2;
  cv.style.width = vw + 'px';
  cv.style.height = vh + 'px';
  cv.width = Math.round(vw * dpr);
  cv.height = Math.round(vh * dpr);
}
window.addEventListener('resize', resize);
resize();

// ===== Save =====
let best = 0;
try { best = +(localStorage.getItem('flappyrogue_best') || 0); } catch (e) {}
function saveBest() { try { localStorage.setItem('flappyrogue_best', best); } catch (e) {} }

// ===== Game state =====
let state = 'menu'; // menu | play | upgrade | dead
let bird, pipes, score, spawnT, invuln, deadT, cards, p, taken, time = 0;

const BASE = { gravity: 1500, flap: -430, gap: 150, speed: 130, shield: 0 };

const POOL = [
  { name: 'Shield',      desc: 'Survive one hit',          color: '#3fa7d6', apply() { p.shield++; } },
  { name: 'Wide Gaps',   desc: 'Pipe gaps +12',            color: '#59c173', apply() { p.gap = Math.min(p.gap + 12, 210); } },
  { name: 'Light Wings', desc: 'Lower gravity',            color: '#f2a65a', apply() { p.gravity *= 0.9; p.flap *= 0.95; } },
  { name: 'Slow Motion', desc: 'Pipes move 10% slower',    color: '#9b6bd6', apply() { p.speed *= 0.9; } },
  { name: 'Tiny Bird',   desc: 'Smaller hitbox',           color: '#e65f5c', apply() { bird.r = Math.max(8, bird.r * 0.85); } },
];

function resetGame() {
  bird = { x: 90, y: H / 2 - 40, vy: 0, r: 13 };
  pipes = [];
  score = 0;
  spawnT = 0.9;
  invuln = 0;
  taken = [];
  p = Object.assign({}, BASE);
}
resetGame();

function startGame() {
  resetGame();
  state = 'play';
  bird.vy = p.flap;
}

function die() {
  state = 'dead';
  deadT = 0;
  if (score > best) { best = score; saveBest(); }
}

function openUpgrade() {
  state = 'upgrade';
  const pool = POOL.slice();
  cards = [];
  for (let i = 0; i < 3; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    cards.push(pool.splice(idx, 1)[0]);
  }
}

function pickCard(i) {
  const c = cards[i];
  c.apply();
  taken.push(c.name);
  state = 'play';
  invuln = 1.2;
  bird.vy = -150;
}

function hit(fromGroundOrPipe) {
  if (p.shield > 0) {
    p.shield--;
    invuln = 1.3;
    bird.vy = p.flap * 0.8;
    if (bird.y + bird.r > H - GROUND) bird.y = H - GROUND - bird.r - 2;
  } else {
    die();
  }
}

// ===== Update =====
function update(dt) {
  time += dt;
  if (state === 'dead') { deadT += dt; }
  if (state !== 'play') return;

  bird.vy += p.gravity * dt;
  bird.y += bird.vy * dt;
  if (invuln > 0) invuln -= dt;

  // ceiling clamp
  if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }

  // spawn pipes
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnT = 1.6;
    const margin = 50;
    const minC = margin + p.gap / 2;
    const maxC = H - GROUND - margin - p.gap / 2;
    pipes.push({ x: W + 10, w: 54, cy: minC + Math.random() * (maxC - minC), gap: p.gap, passed: false });
  }

  for (const pp of pipes) pp.x -= p.speed * dt;
  while (pipes.length && pipes[0].x < -80) pipes.shift();

  // collisions
  if (invuln <= 0) {
    if (bird.y + bird.r > H - GROUND) { hit(); if (state !== 'play') return; }
    for (const pp of pipes) {
      if (bird.x + bird.r > pp.x && bird.x - bird.r < pp.x + pp.w) {
        if (bird.y - bird.r < pp.cy - pp.gap / 2 || bird.y + bird.r > pp.cy + pp.gap / 2) {
          hit();
          break;
        }
      }
    }
  } else if (bird.y + bird.r > H - GROUND) {
    bird.y = H - GROUND - bird.r;
    bird.vy = p.flap * 0.8;
  }
  if (state !== 'play') return;

  // scoring
  for (const pp of pipes) {
    if (!pp.passed && pp.x + pp.w < bird.x - bird.r) {
      pp.passed = true;
      score++;
      if (score % 5 === 0) { openUpgrade(); return; }
    }
  }
}

// ===== Input =====
function tap(gx, gy) {
  if (state === 'menu') { startGame(); }
  else if (state === 'play') { bird.vy = p.flap; }
  else if (state === 'upgrade') {
    for (let i = 0; i < 3; i++) {
      const y = 170 + i * 120;
      if (gx > 30 && gx < W - 30 && gy > y && gy < y + 100) { pickCard(i); return; }
    }
  }
  else if (state === 'dead') { if (deadT > 0.5) startGame(); }
}
window.addEventListener('pointerdown', e => {
  e.preventDefault();
  tap((e.clientX - offX) / scale, (e.clientY - offY) / scale);
}, { passive: false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); tap(W / 2, H / 2); }
});
window.addEventListener('contextmenu', e => e.preventDefault());

// ===== Drawing helpers =====
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, size, color, align) {
  ctx.font = 'bold ' + size + 'px -apple-system, Helvetica, Arial, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 7);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = color || '#fff';
  ctx.fillText(s, x, y);
}

function drawBird(x, y, vy, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.max(-0.5, Math.min(1.1, vy / 600)));
  ctx.fillStyle = '#f7d44a';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#7a5a00'; ctx.lineWidth = 2; ctx.stroke();
  // wing
  ctx.fillStyle = '#e8b72b';
  ctx.beginPath(); ctx.ellipse(-r * 0.3, r * 0.2, r * 0.55, r * 0.35, 0, 0, Math.PI * 2); ctx.fill();
  // eye
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(r * 0.4, -r * 0.3, r * 0.32, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(r * 0.5, -r * 0.3, r * 0.14, 0, Math.PI * 2); ctx.fill();
  // beak
  ctx.fillStyle = '#f0793a';
  ctx.beginPath(); ctx.moveTo(r * 0.7, 0); ctx.lineTo(r * 1.3, r * 0.15); ctx.lineTo(r * 0.7, r * 0.4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPipe(pp) {
  const topH = pp.cy - pp.gap / 2;
  const botY = pp.cy + pp.gap / 2;
  const botH = H - GROUND - botY;
  ctx.fillStyle = '#5cb85c';
  ctx.strokeStyle = '#2f6b2f';
  ctx.lineWidth = 3;
  ctx.fillRect(pp.x, 0, pp.w, topH); ctx.strokeRect(pp.x, 0, pp.w, topH);
  ctx.fillRect(pp.x, botY, pp.w, botH); ctx.strokeRect(pp.x, botY, pp.w, botH);
  // caps
  ctx.fillRect(pp.x - 4, topH - 22, pp.w + 8, 22); ctx.strokeRect(pp.x - 4, topH - 22, pp.w + 8, 22);
  ctx.fillRect(pp.x - 4, botY, pp.w + 8, 22); ctx.strokeRect(pp.x - 4, botY, pp.w + 8, 22);
}

// ===== Draw =====
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  // sky
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4ec0ca'); g.addColorStop(1, '#bfeaf0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // pipes
  for (const pp of pipes) drawPipe(pp);

  // ground
  ctx.fillStyle = '#ded895'; ctx.fillRect(0, H - GROUND, W, GROUND);
  ctx.fillStyle = '#73bf2e'; ctx.fillRect(0, H - GROUND, W, 12);
  ctx.fillStyle = '#5a9a22';
  const off = (state === 'play' ? time * p.speed : 0) % 24;
  for (let x = -24; x < W + 24; x += 24) ctx.fillRect(x - off, H - GROUND, 12, 12);

  // bird
  if (state === 'menu') {
    drawBird(W / 2, H / 2 - 40 + Math.sin(time * 4) * 8, 0, 13);
  } else {
    const blink = invuln > 0 && Math.floor(time * 12) % 2 === 0;
    if (!blink || state !== 'play') drawBird(bird.x, bird.y, bird.vy, bird.r);
    if (p.shield > 0 && state !== 'dead') {
      ctx.strokeStyle = 'rgba(63,167,214,0.9)'; ctx.lineWidth = 3;
      ctx.fillStyle = 'rgba(63,167,214,0.18)';
      ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.r + 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }

  // HUD
  if (state === 'play' || state === 'upgrade') {
    txt(String(score), W / 2, 60, 48);
    if (p.shield > 0) txt('Shield x' + p.shield, 14, 110, 16, '#bfe9ff', 'left');
    const next = 5 - (score % 5);
    txt('Upgrade in ' + next, W - 14, 24, 14, '#fff', 'right');
  }

  if (state === 'menu') {
    txt('FLAPPY', W / 2, 150, 54, '#fff');
    txt('ROGUE', W / 2, 205, 54, '#f7d44a');
    txt('Tap to start', W / 2, 400, 26, '#fff');
    txt('Best: ' + best, W / 2, 440, 20, '#fff');
  }

  if (state === 'upgrade') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    txt('Choose an upgrade', W / 2, 120, 28);
    for (let i = 0; i < 3; i++) {
      const c = cards[i], y = 170 + i * 120;
      ctx.fillStyle = c.color;
      rr(30, y, W - 60, 100, 16); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3; ctx.stroke();
      txt(c.name, W / 2, y + 36, 26);
      txt(c.desc, W / 2, y + 70, 17);
    }
  }

  if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    txt('Game Over', W / 2, 170, 44, '#fff');
    txt('Score: ' + score, W / 2, 245, 32, '#f7d44a');
    txt('Best: ' + best, W / 2, 290, 22);
    if (taken.length) {
      txt('Upgrades:', W / 2, 345, 16, '#cde');
      txt(taken.join(', '), W / 2, 370, 14, '#fff');
    }
    if (deadT > 0.5) txt('Tap to retry', W / 2, 470, 28);
  }

  ctx.restore();
}

// ===== Loop =====
let last = performance.now();
function frame(ts) {
  const dt = Math.min((ts - last) / 1000, 0.033);
  last = ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
